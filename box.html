<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent with 5 Child Boxes</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f2f2f2;
    }

    /* Parent Box */
    .parent{
        width:900px;
        height:200px;
        border:3px solid black;
        display:flex;              /* Makes children in one row */
        justify-content:space-evenly;
        align-items:center;
        background:white;
    }

    /* Child Boxes */
    .child{
        width:120px;
        height:120px;
        background:#4CAF50;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:20px;
        font-weight:bold;
        border-radius:10px;
    }
</style>
</head>

<body>

<div class="parent">
    <div class="child">1</div>
    <div class="child">2</div>
    <div class="child">3</div>
    <div class="child">4</div>
    <div class="child">5</div>
</div>

</body>
</html>
