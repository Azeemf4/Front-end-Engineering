<body>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Meme</title>

<style>
    body{
        margin:0;
        padding:0;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#222;
        font-family:Arial;
    }

    .meme{
        width:600px;
        position:relative;
        border:5px solid white;
    }

    .meme img{
        width:100%;
        display:block;
    }

    .top-text,
    .bottom-text{
        position:absolute;
        width:100%;
        text-align:center;
        color:white;
        font-size:30px;
        font-weight:bold;
        text-transform:uppercase;
        text-shadow:
            2px 2px 0 black,
            -2px -2px 0 black,
            2px -2px 0 black,
            -2px 2px 0 black;
    }

    .top-text{
        top:15px;
    }

    .bottom-text{
          bottom:15px;
    }
</style>

</head>
<body>

<div class="meme">
    <div class="top-text">WHEN THE CODE RUNS</div>

    <img src="https://i.imgflip.com/30b1gx.jpg" alt="Meme">

    <div class="bottom-text">ON THE FIRST TRY 😎</div>
</div>

</body>
</html>
</body>
</html>
