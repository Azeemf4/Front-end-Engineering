<!DOCTYPE html>
<html>
<head>
    <title>Simple Navbar</title>

    <style>
        nav{
            background-color: rgb(150, 46, 46);
            padding: 15px;
            gap:15px; 
        }

        a{
            color: rgb(231, 246, 18);
            text-decoration: none;
            margin-right: 320px;
            font-size: 18px;
        }

        a:hover{
            color: yellow;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
