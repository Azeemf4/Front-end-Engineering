<!DOCTYPE html>
<html>
<head>
    <title>Racist board</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: lightgray;
        }

        .board{
            width: 480px;
            height: 480px;
            display: flex;
            flex-wrap: wrap;
            border: 3px solid black;
        }

        .box{
            width: 60px;
            height: 60px;
        }

        .white{
            background-color: white;
        }

        .black{
            background-color: black;
        }
    </style>
</head>

<body>

<div class="board">

    <!-- Row 1 -->
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>

    <!-- Row 2 -->
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>

    <!-- Row 3 -->
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>

    <!-- Row 4 -->
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>

    <!-- Row 5 -->
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>

    <!-- Row 6 -->
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>

    <!-- Row 7 -->
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>

    <!-- Row 8 -->
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>
    <div class="box black"></div>
    <div class="box white"></div>

</div>

</body>
</html>
