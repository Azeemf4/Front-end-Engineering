<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Login Page</title>

<style>
*{
    margin:0;
  padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#4facfe,#00c6fb,#0066ff);
    position:relative;
}


.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(3px);
}

.circle1{
    width:220px;
    height:220px;
    background:#ffd9e8;
    top:70px;
    left:120px;
}

.circle2{
    width:170px;
    height:170px;
    background:#fff2c7;
    bottom:70px;
    right:150px;
}

/* Navigation */

nav{
    position:absolute;
    top:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 40px;
    color:white;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

/* Login Box */

.login-box{
    width:340px;
    padding:35px;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    backdrop-filter:blur(15px);
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    text-align:center;
    position:relative;
}

.close-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:transparent;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.close-btn:hover{
    color:red;
    transform:scale(1.2);
}

.login-box h2{
    color:#fff;
    margin-bottom:8px;
}

.login-box p{
    color:#eee;
    margin-bottom:20px;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    outline:none;
    border-radius:8px;
    font-size:15px;
}

button.login{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ffcc33;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button.login:hover{
    background:#ffb300;
    transform:scale(1.03);
}

.forgot{
    display:block;
    margin-top:15px;
    color:white;
    text-decoration:none;
    font-size:14px;
}

.signup{
    margin-top:15px;
    color:white;
    font-size:14px;
}

.signup a{
    color:#ffd54f;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>

<nav>
    <div class="logo">CodeVerse</div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Contact</a>
        <a href="#">About</a>
    </div>
</nav>

<div class="login-box">

    <!-- Cross Button -->
    <button class="close-btn"
        onclick="document.querySelector('.login-box').style.display='none'">
        &times;
    </button>

    <h2>Welcome Back</h2>
    <p>Login to continue</p>

    <form>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button type="submit" class="login">Login</button>

    </form>

    <a href="#" class="forgot">Forgot Password?</a>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign Up</a>
    </div>

</div>

</body>
</html>
